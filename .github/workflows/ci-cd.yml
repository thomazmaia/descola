name: Descola CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── JOB 1: Lint e validação estática ──────────────────────────────────────
  lint:
    name: Análise estática (ESLint + Stylelint + HTMLHint)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependências de lint
        run: npm install -g eslint stylelint htmlhint stylelint-config-standard

      - name: Rodar ESLint (JavaScript)
        run: eslint js/*.js --max-warnings=100
        continue-on-error: true

      - name: Rodar Stylelint (CSS)
        run: stylelint "css/style.css"
        continue-on-error: true

      - name: Rodar HTMLHint (HTML)
        run: htmlhint "*.html"

  # ── JOB 2: Build (validação de estrutura) ─────────────────────────────────
  build:
    name: Build e validação de estrutura
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Verificar arquivos obrigatórios
        run: |
          echo "Verificando estrutura do projeto..."
          test -f index.html        && echo "OK index.html"        || (echo "ERRO index.html nao encontrado" && exit 1)
          test -f vagas.html        && echo "OK vagas.html"        || (echo "ERRO vagas.html nao encontrado" && exit 1)
          test -f vaga-detalhe.html && echo "OK vaga-detalhe.html" || (echo "ERRO vaga-detalhe.html nao encontrado" && exit 1)
          test -f candidatura.html  && echo "OK candidatura.html"  || (echo "ERRO candidatura.html nao encontrado" && exit 1)
          test -f painel.html       && echo "OK painel.html"       || (echo "ERRO painel.html nao encontrado" && exit 1)
          test -f sobre.html        && echo "OK sobre.html"        || (echo "ERRO sobre.html nao encontrado" && exit 1)
          test -f css/style.css     && echo "OK css/style.css"     || (echo "ERRO css/style.css nao encontrado" && exit 1)
          test -f js/main.js        && echo "OK js/main.js"        || (echo "ERRO js/main.js nao encontrado" && exit 1)
          test -f data/vagas.json   && echo "OK data/vagas.json"   || (echo "ERRO data/vagas.json nao encontrado" && exit 1)
          echo "Estrutura valida."

      - name: Validar JSON das vagas
        run: |
          echo "Validando vagas.json..."
          python3 -c "
          import json, sys
          with open('data/vagas.json') as f:
              vagas = json.load(f)
          campos = ['id','titulo','empresa','cidade','estado','tipo','modalidade','nivel']
          for v in vagas:
              for c in campos:
                  if c not in v:
                      print('ERRO: campo ' + c + ' ausente na vaga ' + str(v.get('id','?')))
                      sys.exit(1)
          print('vagas.json valido — ' + str(len(vagas)) + ' vagas encontradas.')
          "

      - name: Upload do artefato de build
        uses: actions/upload-artifact@v4
        with:
          name: descola-build
          path: |
            *.html
            css/
            js/
            data/
          retention-days: 7

  # ── JOB 3: Deploy para GitHub Pages ───────────────────────────────────────
  deploy:
    name: Deploy para GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload para GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4