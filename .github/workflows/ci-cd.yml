name: Descola CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── JOB 1: Lint e validação estática ──────────────────────────────────────
  lint:
    name: Análise estática (ESLint + Stylelint + HTMLHint)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências de lint
        run: |
          npm install -g eslint stylelint htmlhint
          npm install -g stylelint-config-standard

      - name: Rodar ESLint (JavaScript)
        run: eslint js/*.js --max-warnings=100
        continue-on-error: true

      - name: Rodar Stylelint (CSS)
        run: stylelint "css/style.css"
        continue-on-error: true

      - name: Rodar HTMLHint (HTML)
        run: htmlhint "*.html"

  # ── JOB 2: Build (validação de estrutura) ─────────────────────────────────
  build:
    name: Build e validação de estrutura
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Verificar arquivos obrigatórios
        run: |
          echo "Verificando estrutura do projeto..."
          test -f index.html        && echo "✅ index.html"        || (echo "❌ index.html não encontrado" && exit 1)
          test -f vagas.html        && echo "✅ vagas.html"        || (echo "❌ vagas.html não encontrado" && exit 1)
          test -f vaga-detalhe.html && echo "✅ vaga-detalhe.html" || (echo "❌ vaga-detalhe.html não encontrado" && exit 1)
          test -f candidatura.html  && echo "✅ candidatura.html"  || (echo "❌ candidatura.html não encontrado" && exit 1)
          test -f painel.html       && echo "✅ painel.html"       || (echo "❌ painel.html não encontrado" && exit 1)
          test -f sobre.html        && echo "✅ sobre.html"        || (echo "❌ sobre.html não encontrado" && exit 1)
          test -f css/style.css     && echo "✅ css/style.css"     || (echo "❌ css/style.css não encontrado" && exit 1)
          test -f js/main.js        && echo "✅ js/main.js"        || (echo "❌ js/main.js não encontrado" && exit 1)
          test -f data/vagas.json   && echo "✅ data/vagas.json"   || (echo "❌ data/vagas.json não encontrado" && exit 1)
          echo "✅ Estrutura válida."

      - name: Validar JSON das vagas
        run: |
          echo "Validando vagas.json..."
          python3 -c "
          import json, sys
          with open('data/vagas.json') as f:
              vagas = json.load(f)
          campos = ['id','titulo','empresa','cidade','estado','tipo','modalidade','nivel']
          for v in vagas:
              for c in campos:
                  if c not in v:
                      print(f'ERRO: campo {c} ausente na vaga {v.get(\"id\",\"?\")}')
                      sys.exit(1)
          print(f'✅ vagas.json válido — {len(vagas)} vagas encontradas.')
          "

      - name: Upload do artefato de build
        uses: actions/upload-artifact@v4
        with:
          name: descola-build
          path: |
            *.html
            css/
            js/
            data/
          retention-days: 7

  # ── JOB 3: Deploy para GitHub Pages ───────────────────────────────────────
  deploy:
    name: Deploy para GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload para GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
